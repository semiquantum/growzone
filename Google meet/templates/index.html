<!DOCTYPE html>
<html>
<head>
    <title>SQGrowZone Meet Generator</title>
</head>
<body>
    <h1>Create Google Meet Link</h1>
    <form action="/create_meet" method="post">
        <label>Meeting Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Description (optional):</label><br>
        <textarea name="description"></textarea><br><br>

        <button type="submit">Create Google Meet Link</button>
    </form>
</body>
</html>
